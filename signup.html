<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Créez votre compte Soirées Mons">
    <title>Inscription - Soirées Mons</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/assets/css/design-system.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages/auth.css">
</head>
<body class="auth-page">

    <!-- Back Home Button -->
    <div class="back-home">
        <a href="/index.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Accueil
        </a>
    </div>

    <!-- Main Container -->
    <div class="auth-container">
        <div class="auth-card">

            <!-- Header -->
            <header class="auth-header">
                <h1>Créer un compte</h1>
                <p>Rejoignez la communauté Soirées Mons</p>
            </header>

            <!-- Error Message -->
            <div id="error-message" class="error-message"></div>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="name" class="form-label">Nom complet</label>
                    <input
                        type="text"
                        id="name"
                        class="form-input"
                        placeholder="Jean Dupont"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Adresse email</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="votre@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirmer le mot de passe</label>
                    <input
                        type="password"
                        id="confirm-password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="signup-btn">
                    <span class="btn-text">Créer mon compte</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>OU</span>
            </div>

            <!-- Social Signup Buttons -->
            <div class="social-buttons">
                <button class="btn-social" id="google-signup-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                        <path d="M9.003 18c2.43 0 4.467-.806 5.956-2.18L12.05 13.56c-.806.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.96v2.332C2.44 15.983 5.485 18 9.003 18z" fill="#34A853"/>
                        <path d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.96H.957C.347 6.175 0 7.55 0 9.002c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                        <path d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.428 0 9.003 0 5.485 0 2.44 2.017.96 4.958L3.967 7.29c.708-2.127 2.692-3.71 5.036-3.71z" fill="#EA4335"/>
                    </svg>
                    <span>S'inscrire avec Google</span>
                </button>
            </div>

            <!-- Footer Link -->
            <footer class="auth-footer">
                <p>Déjà un compte ? <a href="/login.html">Se connecter</a></p>
            </footer>

        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT - MODULE
         ========================================== -->
    <script type="module" src="/assets/js/pages/signup.js"></script>

</body>
</html>
