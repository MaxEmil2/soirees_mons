<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Soirées Mons</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="/public/styles/design-system.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">🎉 Soirées Mons</a>
            <a href="/" class="btn btn-secondary btn-sm">← Accueil</a>
        </div>
    </nav>
    <div style="min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(135deg,rgba(102,126,234,0.1) 0%,rgba(118,75,162,0.1) 100%)">
        <div class="card fade-in" style="max-width:450px;width:100%">
            <div class="card-header text-center">
                <h1 class="card-title">Créer un compte</h1>
                <p style="color:var(--text-secondary);margin-top:8px">Rejoignez Soirées Mons ! 🎉</p>
            </div>
            <div class="card-body">
                <form id="signup-form">
                    <div class="form-group">
                        <label class="form-label">Nom complet</label>
                        <input type="text" id="name" class="form-input" placeholder="Jean Dupont" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="vous@exemple.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%" id="signup-btn">Créer mon compte</button>
                </form>
                <div style="display:flex;align-items:center;gap:16px;margin:32px 0">
                    <div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div>
                    <span style="color:var(--text-tertiary);font-size:0.875rem">OU</span>
                    <div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div>
                </div>
                <button id="google-btn" class="btn btn-secondary" style="width:100%">🔵 Continuer avec Google</button>
                <div style="margin-top:24px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.1);text-align:center">
                    <span style="color:var(--text-secondary)">Déjà un compte ?</span>
                    <a href="login.html" style="color:var(--primary);margin-left:8px;font-weight:600">Se connecter</a>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import{authService}from'./src/services/auth.service.js';import{toast}from'./src/components/Toast.js';
        if(authService.isAuthenticated())window.location.href='dashboard.html';
        document.getElementById('signup-form').addEventListener('submit',async e=>{e.preventDefault();const r=await authService.signUpWithEmail(email.value.trim(),password.value,name.value.trim());r.success?(toast.success('Compte créé !'),setTimeout(()=>window.location.href='dashboard.html',1000)):(toast.error(r.error),signupBtn.disabled=false)});
        document.getElementById('google-btn').addEventListener('click',async()=>{const r=await authService.signInWithGoogle();r.success?(toast.success('Compte créé !'),setTimeout(()=>window.location.href='dashboard.html',1000)):toast.error(r.error)});
    </script>
</body>
</html>
