<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Réinitialisez votre mot de passe Soirées Mons">
    <title>Mot de passe oublié - Soirées Mons</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/assets/css/design-system.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages/auth.css">

    <style>
        .success-message {
            display: none;
            background: rgba(82, 196, 26, 0.1);
            border: 1px solid rgba(82, 196, 26, 0.3);
            border-radius: var(--radius-md);
            padding: 0.875rem 1rem;
            margin-bottom: var(--space-4);
            color: var(--success);
            font-size: 0.875rem;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body class="auth-page">

    <!-- Back Home Button -->
    <div class="back-home">
        <a href="/index.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Accueil
        </a>
    </div>

    <!-- Main Container -->
    <div class="auth-container">
        <div class="auth-card">

            <!-- Header -->
            <header class="auth-header">
                <h1>Mot de passe oublié ?</h1>
                <p>Entrez votre email pour recevoir un lien de réinitialisation</p>
            </header>

            <!-- Error Message -->
            <div id="error-message" class="error-message"></div>

            <!-- Success Message -->
            <div id="success-message" class="success-message"></div>

            <!-- Reset Form -->
            <form id="reset-form" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Adresse email</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="votre@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="reset-btn">
                    <span class="btn-text">Envoyer le lien</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
            </form>

            <!-- Footer Link -->
            <footer class="auth-footer">
                <p>Vous vous souvenez de votre mot de passe ? <a href="/login.html">Se connecter</a></p>
            </footer>

        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT - MODULE
         ========================================== -->
    <script type="module" src="/assets/js/pages/forgot-password.js"></script>

</body>
</html>
