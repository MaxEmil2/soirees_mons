<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Soirées Mons</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="design-system.css">
    <style>
        /* ========================================
           FOND ANIMÉ & PARTICULES
           ======================================== */

        body {
            background: linear-gradient(135deg, #0a0a12 0%, #1a1a2e 50%, #0a0a12 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-xl);
            overflow: hidden;
            position: relative;
        }

        /* Particules flottantes animées */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.15) 0%, transparent 70%);
            top: -250px;
            left: -250px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.12) 0%, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation-delay: -10s;
            animation-duration: 15s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* ========================================
           BOUTON RETOUR ACCUEIL
           ======================================== */

        .back-home {
            position: fixed;
            top: var(--space-lg);
            left: var(--space-lg);
            z-index: 100;
        }

        .back-home a {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: 0.75rem 1.25rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all var(--transition-base);
        }

        .back-home a:hover {
            background: var(--bg-card);
            border-color: var(--border-medium);
            color: var(--accent-400);
            transform: translateX(-4px);
        }

        /* ========================================
           CONTENEUR PRINCIPAL
           ======================================== */

        .reset-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ========================================
           CARTE GLASSMORPHISM
           ======================================== */

        .reset-card {
            position: relative;
            background: rgba(22, 33, 62, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-2xl);
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 100px rgba(0, 212, 255, 0.1);
            overflow: hidden;
        }

        /* Bordure dégradée avec mask */
        .reset-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-2xl);
            padding: 1px;
            background: linear-gradient(135deg,
                rgba(108, 99, 255, 0.3),
                rgba(0, 212, 255, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box,
                          linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ========================================
           HEADER
           ======================================== */

        .header {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: var(--space-md);
            background: linear-gradient(135deg, #00d4ff 0%, #6c63ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
        }

        /* ========================================
           FORMULAIRE
           ======================================== */

        .reset-form .input-group {
            margin-bottom: var(--space-lg);
        }

        .reset-form label {
            display: block;
            margin-bottom: var(--space-sm);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .reset-form input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--transition-base);
            backdrop-filter: blur(10px);
        }

        .reset-form input:focus {
            outline: none;
            border-color: var(--accent-500);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .reset-form input::placeholder {
            color: var(--text-muted);
        }

        /* ========================================
           BOUTONS
           ======================================== */

        .btn-reset {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--gradient-accent);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            box-shadow: 0 4px 14px rgba(0, 212, 255, 0.4);
            margin-bottom: var(--space-lg);
        }

        .btn-reset:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
        }

        .btn-reset:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-reset:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-text {
            display: inline-block;
        }

        .btn-loader {
            display: none;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========================================
           MESSAGES
           ======================================== */

        .message {
            padding: 1rem 1.25rem;
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            font-size: 0.875rem;
            display: none;
            animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.show {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .error-message {
            background: rgba(255, 77, 79, 0.15);
            border: 1px solid rgba(255, 77, 79, 0.3);
            color: var(--error);
        }

        .success-message {
            background: rgba(82, 196, 26, 0.15);
            border: 1px solid rgba(82, 196, 26, 0.3);
            color: var(--success);
        }

        .message-icon {
            font-size: 1.125rem;
        }

        /* ========================================
           FOOTER LINK
           ======================================== */

        .footer-link {
            text-align: center;
            margin-top: var(--space-lg);
        }

        .footer-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .footer-link a:hover {
            color: var(--primary-500);
        }

        /* ========================================
           RESPONSIVE
           ======================================== */

        @media (max-width: 768px) {
            body {
                padding: var(--space-lg);
            }

            .back-home {
                top: var(--space-md);
                left: var(--space-md);
            }

            .back-home a {
                padding: 0.625rem 1rem;
                font-size: 0.875rem;
            }

            .reset-card {
                padding: 36px 28px;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .header p {
                font-size: 0.9375rem;
            }
        }

        @media (max-width: 480px) {
            .reset-container {
                max-width: 100%;
            }

            .reset-card {
                padding: 28px 20px;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Bouton retour accueil -->
    <div class="back-home">
        <a href="index.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Accueil
        </a>
    </div>

    <!-- Conteneur principal -->
    <div class="reset-container">
        <div class="reset-card">
            <!-- Header -->
            <div class="header">
                <h1>🔐 Mot de passe oublié ?</h1>
                <p>Entrez votre email pour recevoir un lien de réinitialisation</p>
            </div>

            <!-- Messages -->
            <div id="error-message" class="message error-message">
                <span class="message-icon">❌</span>
                <span id="error-text"></span>
            </div>

            <div id="success-message" class="message success-message">
                <span class="message-icon">✅</span>
                <span id="success-text"></span>
            </div>

            <!-- Formulaire -->
            <form id="reset-form" class="reset-form">
                <div class="input-group">
                    <label for="email">Adresse email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="votre@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="btn-reset" id="reset-btn">
                    <span class="btn-text" id="btn-text">Envoyer le lien</span>
                    <span class="btn-loader" id="btn-loader">⏳</span>
                </button>
            </form>

            <!-- Lien retour connexion -->
            <div class="footer-link">
                <a href="login.html">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Retour à la connexion
                </a>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module" src="forgot-password.js"></script>
</body>
</html>
