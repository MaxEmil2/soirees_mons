<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Soirées Mons</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Conteneur principal avec fond sombre -->
    <div class="container">
        <!-- Carte de réinitialisation centrée -->
        <div class="login-card">
            <!-- Logo ou titre -->
            <div class="header">
                <h1>Mot de passe oublié ?</h1>
                <p>Entrez votre email pour recevoir un lien de réinitialisation</p>
            </div>

            <!-- Zone d'affichage des messages -->
            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>

            <!-- Formulaire de réinitialisation -->
            <form id="reset-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="votre@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <!-- Bouton d'envoi -->
                <button type="submit" class="btn btn-primary" id="reset-btn">
                    <span class="btn-text">Envoyer le lien</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
            </form>

            <!-- Lien retour connexion -->
            <div class="footer-link">
                <p><a href="login.html">← Retour à la connexion</a></p>
            </div>
        </div>
    </div>

    <!-- Import Firebase SDK v10 (ES Modules) -->
    <script type="module" src="forgot-password.js"></script>
</body>
</html>
