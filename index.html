<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Soirées Mons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Conteneur principal avec fond sombre -->
    <div class="container">
        <!-- Carte de connexion centrée -->
        <div class="login-card">
            <!-- Logo ou titre -->
            <div class="header">
                <h1>Bienvenue</h1>
                <p>Connectez-vous à votre compte</p>
            </div>

            <!-- Zone d'affichage des erreurs -->
            <div id="error-message" class="error-message"></div>

            <!-- Formulaire de connexion email/mot de passe -->
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="votre@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <!-- Bouton de connexion principal -->
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span class="btn-text">Se connecter</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
            </form>

            <!-- Séparateur -->
            <div class="divider">
                <span>OU</span>
            </div>

            <!-- Boutons de connexion sociale -->
            <div class="social-buttons">
                <!-- Connexion Google -->
                <button class="btn btn-social btn-google" id="google-login-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                        <path d="M9.003 18c2.43 0 4.467-.806 5.956-2.18L12.05 13.56c-.806.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.96v2.332C2.44 15.983 5.485 18 9.003 18z" fill="#34A853"/>
                        <path d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.96H.957C.347 6.175 0 7.55 0 9.002c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                        <path d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.428 0 9.003 0 5.485 0 2.44 2.017.96 4.958L3.967 7.29c.708-2.127 2.692-3.71 5.036-3.71z" fill="#EA4335"/>
                    </svg>
                    <span>Continuer avec Google</span>
                </button>

                <!-- Connexion Apple -->
                <button class="btn btn-social btn-apple" id="apple-login-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                        <path d="M14.94 13.53c-.36.77-.54 1.12-1.01 1.8-.66.95-1.58 2.14-2.73 2.15-1.01.01-1.27-.66-2.65-.65-1.37 0-1.66.66-2.71.68-1.15.01-2-1.09-2.66-2.04-1.87-2.65-2.07-5.76-.91-7.42.82-1.18 2.12-1.87 3.34-1.87 1.24 0 2.02.67 3.05.67.99 0 1.59-.67 3.01-.67 1.08 0 2.22.58 3.04 1.59-2.67 1.46-2.24 5.27.43 6.76zM11.7 2.95c.53-.7.94-1.68.79-2.7-.86.04-1.88.62-2.48 1.35-.52.63-.96 1.61-.79 2.56.93.03 1.89-.53 2.48-1.21z"/>
                    </svg>
                    <span>Continuer avec Apple</span>
                </button>
            </div>

            <!-- Lien inscription (optionnel) -->
            <div class="footer-link">
                <p>Pas encore de compte ? <a href="#" id="signup-link">S'inscrire</a></p>
            </div>
        </div>
    </div>

    <!-- Import Firebase SDK v10 (ES Modules) -->
    <script type="module" src="app.js"></script>
</body>
</html>
