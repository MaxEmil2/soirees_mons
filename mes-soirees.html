<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Événements - Soirées Mons</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="/public/styles/design-system.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">🎉 Soirées Mons</a>
            <ul class="navbar-menu">
                <li><a href="dashboard.html" class="navbar-link">Mon Compte</a></li>
                <li><a href="scanner.html" class="navbar-link">Scanner</a></li>
                <li><button id="logout-btn" class="btn btn-danger btn-sm">Déconnexion</button></li>
            </ul>
        </div>
    </nav>
    <div class="container" style="margin-top:40px;margin-bottom:80px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:40px">
            <h1 class="fade-in">Mes Événements</h1>
            <button id="create-btn" class="btn btn-primary">+ Créer un événement</button>
        </div>
        <div id="events-loading" class="text-center" style="padding:60px 0">
            <div class="loader" style="margin:0 auto"></div>
            <p style="margin-top:20px">Chargement...</p>
        </div>
        <div id="events-grid" class="grid grid-cols-3" style="gap:24px"></div>
    </div>
    <script type="module">
        import{authService}from'./src/services/auth.service.js';import{eventsService}from'./src/services/events.service.js';import{createEventCard}from'./src/components/EventCard.js';import{Modal}from'./src/components/Modal.js';import{toast}from'./src/components/Toast.js';
        if(!authService.isAuthenticated())window.location.href='login.html';
        async function load(){const r=await eventsService.getMyEvents(authService.currentUser.uid);document.getElementById('events-loading').style.display='none';if(r.success){const g=document.getElementById('events-grid');r.events.forEach(e=>{const c=createEventCard(e);c.addEventListener('click',()=>showModal(e));g.appendChild(c)})}}
        function showModal(e){const m=new Modal({title:e.title,content:`<p>${e.description}</p><p>Statut: ${e.status}</p><button class="btn btn-danger" onclick="deleteEvent('${e.id}')">Supprimer</button>`});m.show()}
        window.deleteEvent=async(id)=>{if(confirm('Supprimer ?')){const r=await eventsService.deleteEvent(id);r.success?(toast.success('Supprimé'),location.reload()):toast.error(r.error)}};
        document.getElementById('create-btn').addEventListener('click',()=>{const m=new Modal({title:'Créer un événement',content:'<form id="form"><input class="form-input" placeholder="Titre" id="t" required><textarea class="form-textarea" placeholder="Description" id="d" required></textarea><input class="form-input" type="date" id="dt" required><input class="form-input" placeholder="Lieu" id="l" required><input class="form-input" type="number" placeholder="Prix" id="p" required><button class="btn btn-primary" type="submit">Créer</button></form>'});m.show();document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await eventsService.createEvent({title:t.value,description:d.value,date:dt.value,location:l.value,price:parseFloat(p.value)});r.success?(toast.success('Créé !'),location.reload()):toast.error(r.error)}});
        load();
        document.getElementById('logout-btn').addEventListener('click',async()=>{await authService.signOut();window.location.href='/'});
    </script>
</body>
</html>
