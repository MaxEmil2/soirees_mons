<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Soirées - Soirées Mons</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #6c63ff 0%, #a29bfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn {
            background: #6c63ff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #5850db;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.4);
        }

        .btn-secondary {
            background: #2d2d44;
        }

        .btn-secondary:hover {
            background: #3a3a54;
        }

        .btn-danger {
            background: #ff4d4f;
        }

        .btn-danger:hover {
            background: #e03e3e;
        }

        .card {
            background: #16213e;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            border: 1px solid #2d2d44;
            margin-bottom: 32px;
        }

        .loading {
            text-align: center;
            padding: 60px 0;
            font-size: 18px;
            color: #b8b8d1;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #b8b8d1;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .event-item {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: 120px 1fr auto;
            gap: 20px;
            align-items: center;
            border: 1px solid #2d2d44;
        }

        .event-image-thumb {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
        }

        .event-details h3 {
            color: white;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .event-details p {
            color: #b8b8d1;
            font-size: 14px;
            margin: 4px 0;
        }

        .event-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .status-approved {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }

        .status-rejected {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .event-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .event-item {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .event-image-thumb {
                margin: 0 auto;
            }

            .event-actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📋 Mes Soirées Proposées</h1>
            <a href="dashboard.html" class="btn btn-secondary">Retour</a>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            Chargement de vos soirées...
        </div>

        <!-- Content -->
        <div id="content" style="display: none;">
            <div class="card">
                <h2 style="color: #6c63ff; margin-bottom: 24px;">Vos soirées</h2>
                <div id="events-list">
                    <!-- Events will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script type="module" src="mes-soirees.js"></script>
</body>
</html>
