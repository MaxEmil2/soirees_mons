<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Soirées - Soirées Mons</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="design-system.css">
    <style>
        /* ========================================
           LAYOUT PRINCIPAL
           ======================================== */

        body {
            background: var(--gradient-bg);
            min-height: 100vh;
            padding: var(--space-2xl) var(--space-lg);
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }

        /* ========================================
           HEADER
           ======================================== */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-2xl);
            flex-wrap: wrap;
            gap: var(--space-lg);
        }

        .page-header h1 {
            font-size: 2.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: 0.875rem 1.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all var(--transition-base);
        }

        .btn-back:hover {
            background: var(--bg-card);
            border-color: var(--border-medium);
            transform: translateX(-4px);
        }

        /* ========================================
           LOADING STATE
           ======================================== */

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-3xl);
            text-align: center;
        }

        .loading-state .spinner {
            margin-bottom: var(--space-lg);
        }

        .loading-state p {
            color: var(--text-secondary);
            font-size: 1.125rem;
        }

        /* ========================================
           EMPTY STATE
           ======================================== */

        .empty-state {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            padding: var(--space-3xl);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .empty-state-icon {
            font-size: 5rem;
            margin-bottom: var(--space-xl);
            opacity: 0.6;
            filter: grayscale(0.3);
        }

        .empty-state h2 {
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            font-size: 1.75rem;
        }

        .empty-state p {
            color: var(--text-tertiary);
            font-size: 1.125rem;
            margin-bottom: var(--space-xl);
            line-height: 1.6;
        }

        .empty-state .btn-primary {
            display: inline-flex;
            margin-top: var(--space-md);
        }

        /* ========================================
           CONTENT GRID
           ======================================== */

        .events-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            padding: var(--space-2xl);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-lg);
        }

        .events-container h2 {
            color: var(--text-primary);
            margin-bottom: var(--space-xl);
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        /* ========================================
           EVENT CARD
           ======================================== */

        .event-item {
            display: grid;
            grid-template-columns: 160px 1fr auto;
            gap: var(--space-xl);
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: var(--space-lg);
            transition: all var(--transition-base);
        }

        .event-item:hover {
            border-color: var(--border-medium);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .event-thumbnail {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .event-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-slow);
        }

        .event-item:hover .event-thumbnail img {
            transform: scale(1.05);
        }

        /* Badge prioritaire */
        .priority-badge {
            position: absolute;
            top: var(--space-sm);
            left: var(--space-sm);
            background: var(--gradient-gold);
            color: #000;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.4);
        }

        .event-details {
            flex: 1;
        }

        .event-details h3 {
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .meta-icon {
            opacity: 0.7;
        }

        .event-status {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            padding: 0.375rem 0.875rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-pending {
            background: rgba(250, 173, 20, 0.15);
            color: var(--warning);
            border: 1px solid rgba(250, 173, 20, 0.3);
        }

        .status-approved {
            background: rgba(82, 196, 26, 0.15);
            color: var(--success);
            border: 1px solid rgba(82, 196, 26, 0.3);
        }

        .status-rejected {
            background: rgba(255, 77, 79, 0.15);
            color: var(--error);
            border: 1px solid rgba(255, 77, 79, 0.3);
        }

        .event-actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-xs);
            padding: 0.625rem 1.125rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-base);
            border: none;
            white-space: nowrap;
        }

        .btn-view {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(108, 99, 255, 0.4);
        }

        .btn-delete {
            background: transparent;
            color: var(--error);
            border: 1px solid var(--error);
        }

        .btn-delete:hover {
            background: var(--error);
            color: white;
            transform: translateY(-2px);
        }

        /* ========================================
           FOOTER
           ======================================== */

        .footer {
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--border-subtle);
            padding: var(--space-2xl) 0;
            margin-top: var(--space-3xl);
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: var(--space-lg);
        }

        .footer-left {
            text-align: left;
        }

        .footer-left p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .footer-left a {
            color: var(--primary-400);
            text-decoration: none;
            transition: all var(--transition-base);
        }

        .footer-left a:hover {
            color: var(--primary-500);
            text-decoration: underline;
        }

        .footer-center {
            text-align: center;
        }

        .footer-logo {
            height: 45px;
            max-width: 150px;
            object-fit: contain;
        }

        .footer-right {
            text-align: right;
            display: flex;
            align-items: center;
            gap: var(--space-md);
            justify-content: flex-end;
        }

        .footer-right p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .social-icons {
            display: flex;
            gap: var(--space-md);
        }

        .social-icons a {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: var(--primary-400);
            transition: all var(--transition-base);
        }

        .social-icons a:hover {
            background: var(--primary-500);
            color: white;
            border-color: var(--primary-500);
            transform: translateY(-2px);
        }

        /* ========================================
           RESPONSIVE
           ======================================== */

        @media (max-width: 992px) {
            .event-item {
                grid-template-columns: 140px 1fr;
                gap: var(--space-lg);
            }

            .event-actions {
                grid-column: 2;
                flex-direction: row;
                justify-content: flex-start;
            }

            .footer-container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: var(--space-xl);
            }

            .footer-left,
            .footer-right {
                text-align: center;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: var(--space-md);
            }

            .page-container {
                width: 100%;
                padding: 0 var(--space-sm);
            }

            .page-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                width: 100%;
            }

            .page-header h1 {
                font-size: 1.75rem;
            }

            .btn-back {
                width: 100%;
                justify-content: center;
            }

            .events-container {
                padding: var(--space-md);
                width: 100%;
            }

            .event-item {
                grid-template-columns: 1fr;
                text-align: center;
                gap: var(--space-md);
                padding: var(--space-md);
            }

            .event-thumbnail {
                margin: 0 auto;
                width: 140px;
                height: 140px;
            }

            .event-details {
                width: 100%;
            }

            .event-meta {
                justify-content: center;
                flex-direction: column;
                align-items: center;
            }

            .event-actions {
                flex-direction: column;
                width: 100%;
                gap: var(--space-xs);
            }

            .event-actions button,
            .event-actions .btn,
            .btn-action {
                width: 100% !important;
                min-width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                padding: 0.75rem 1rem;
                font-size: 0.875rem;
                white-space: normal;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.5rem;
            }

            .events-container h2 {
                font-size: 1.25rem;
            }

            .event-thumbnail {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body class="page-wrapper">
    <div class="page-content">
    <div class="page-container">
        <!-- Header -->
        <div class="page-header">
            <h1>
                <span>📋</span>
                Mes Soirées Proposées
            </h1>
            <a href="dashboard.html" class="btn-back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Retour
            </a>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading-state">
            <div class="spinner spinner-lg"></div>
            <p>Chargement de vos soirées...</p>
        </div>

        <!-- Content (hidden by default) -->
        <div id="content" style="display: none;">
            <div class="events-container">
                <h2>
                    <span>🎉</span>
                    Vos soirées
                </h2>
                <div id="events-list" class="events-list">
                    <!-- Events will be loaded here dynamically -->
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Firebase Script -->
    <script type="module" src="mes-soirees.js"></script>
</body>
</html>
