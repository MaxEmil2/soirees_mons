<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Soirées Mons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .dashboard-card {
            background: #16213e;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            border: 1px solid #2d2d44;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #6c63ff 0%, #a29bfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 24px;
            margin: 24px 0;
            border: 1px solid #2d2d44;
        }

        .user-info p {
            margin: 8px 0;
            color: #b8b8d1;
        }

        .user-info strong {
            color: white;
        }

        .logout-btn {
            background: #6c63ff;
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 24px;
        }

        .logout-btn:hover {
            background: #5850db;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.4);
        }

        .loading {
            text-align: center;
            padding: 60px 0;
            font-size: 18px;
            color: #b8b8d1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-card">
            <div id="loading" class="loading">
                Chargement...
            </div>

            <div id="dashboard-content" style="display: none;">
                <h1>🎉 Bienvenue sur votre Dashboard!</h1>
                <p style="color: #b8b8d1; margin-bottom: 24px;">
                    Vous êtes maintenant connecté avec succès.
                </p>

                <div class="user-info">
                    <h3 style="margin-bottom: 12px; color: #6c63ff;">Informations utilisateur</h3>
                    <p><strong>Email:</strong> <span id="user-email"></span></p>
                    <p><strong>UID:</strong> <span id="user-uid"></span></p>
                    <p><strong>Provider:</strong> <span id="user-provider"></span></p>
                    <p><strong>Date de création:</strong> <span id="user-created"></span></p>
                </div>

                <button class="logout-btn" id="logout-btn">Se déconnecter</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Firebase Authentication
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        // Configuration Firebase - Soirées Mons
        const firebaseConfig = {
            apiKey: "AIzaSyAVGs4DsO6igrgY1EH1Z-cYLe_QMTnPxRg",
            authDomain: "soirees-mons-6ce3e.firebaseapp.com",
            projectId: "soirees-mons-6ce3e",
            storageBucket: "soirees-mons-6ce3e.firebasestorage.app",
            messagingSenderId: "3405335068",
            appId: "1:3405335068:web:394c536d95a33069d66dd9",
            measurementId: "G-526CPT4LQ8"
        };

        // Initialiser Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Éléments DOM
        const loading = document.getElementById('loading');
        const dashboardContent = document.getElementById('dashboard-content');
        const userEmail = document.getElementById('user-email');
        const userUid = document.getElementById('user-uid');
        const userProvider = document.getElementById('user-provider');
        const userCreated = document.getElementById('user-created');
        const logoutBtn = document.getElementById('logout-btn');

        // Vérifier si l'utilisateur est connecté
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // L'utilisateur est connecté - afficher les infos
                console.log('✅ Utilisateur connecté:', user);

                // Remplir les informations
                userEmail.textContent = user.email || 'Non disponible';
                userUid.textContent = user.uid;

                // Déterminer le provider
                const providerData = user.providerData[0];
                let provider = 'Email/Password';
                if (providerData) {
                    if (providerData.providerId === 'google.com') {
                        provider = 'Google';
                    } else if (providerData.providerId === 'apple.com') {
                        provider = 'Apple';
                    }
                }
                userProvider.textContent = provider;

                // Date de création
                const createdDate = new Date(user.metadata.creationTime);
                userCreated.textContent = createdDate.toLocaleDateString('fr-FR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // Afficher le contenu
                loading.style.display = 'none';
                dashboardContent.style.display = 'block';

            } else {
                // L'utilisateur n'est pas connecté - rediriger vers la page de connexion
                console.log('❌ Aucun utilisateur connecté');
                window.location.href = 'index.html';
            }
        });

        // Gérer la déconnexion
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                console.log('✅ Déconnexion réussie');
                window.location.href = 'index.html';
            } catch (error) {
                console.error('❌ Erreur lors de la déconnexion:', error);
                alert('Erreur lors de la déconnexion: ' + error.message);
            }
        });

        console.log('🔥 Dashboard Firebase initialisé');
    </script>
</body>
</html>
