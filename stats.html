<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques - Soirees Mons</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .stats-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #6c63ff;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            opacity: 0.8;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            background: linear-gradient(90deg, #6c63ff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(108, 99, 255, 0.3);
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .buyers-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(108, 99, 255, 0.3);
        }

        .buyers-section h2 {
            color: #6c63ff;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .buyers-table {
            width: 100%;
            border-collapse: collapse;
        }

        .buyers-table th,
        .buyers-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .buyers-table th {
            color: #6c63ff;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        .buyers-table td {
            color: #fff;
            font-size: 14px;
        }

        .buyers-table tr:hover {
            background: rgba(108, 99, 255, 0.1);
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-valid {
            background: rgba(82, 196, 26, 0.2);
            color: #52c41a;
        }

        .status-used {
            background: rgba(250, 173, 20, 0.2);
            color: #faad14;
        }

        .status-refunded {
            background: rgba(255, 77, 79, 0.2);
            color: #ff4d4f;
        }

        .loading {
            text-align: center;
            padding: 60px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(108, 99, 255, 0.3);
            border-top-color: #6c63ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 768px) {
            .buyers-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <main class="stats-container">
        <a href="mes-soirees.html" class="back-button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Retour
        </a>

        <div class="page-header">
            <h1 id="eventName">Statistiques</h1>
            <p id="eventDate"></p>
        </div>

        <div id="loadingState" class="loading">
            <div class="loading-spinner"></div>
            <p>Chargement des statistiques...</p>
        </div>

        <div id="contentState" style="display: none;">
            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-value" id="totalSold">0</div>
                    <div class="stat-label">Preventes vendues</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalUsed">0</div>
                    <div class="stat-label">Tickets utilises</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalRevenue">0</div>
                    <div class="stat-label">Revenus (88%)</div>
                </div>
            </div>

            <div class="buyers-section">
                <h2>Liste des acheteurs</h2>
                <table class="buyers-table">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Prenom</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Statut</th>
                            <th>ID</th>
                        </tr>
                    </thead>
                    <tbody id="buyersTableBody">
                    </tbody>
                </table>
                <div id="noDataMessage" class="no-data" style="display: none;">
                    Aucune prevente pour cet evenement
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY6S4OsO6iqrgY1EH1Z-cYLe_OWTnPxRg",
            authDomain: "soirees-mons-6ce3e.firebaseapp.com",
            projectId: "soirees-mons-6ce3e",
            storageBucket: "soirees-mons-6ce3e.firebasestorage.app",
            messagingSenderId: "3405335068",
            appId: "1:3405335068:web:394c536d95a33069d66dd9",
            measurementId: "G-526CPT4LQ8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app, 'europe-west1');

        // Get eventId from URL
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('eventId');

        if (!eventId) {
            alert('Evenement non specifie');
            window.location.href = 'mes-soirees.html';
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            await loadStats(eventId, user.uid);
        });

        async function loadStats(eventId, userId) {
            const loadingState = document.getElementById('loadingState');
            const contentState = document.getElementById('contentState');

            try {
                // Get event info
                const eventDoc = await getDoc(doc(db, 'events', eventId));
                if (!eventDoc.exists()) {
                    alert('Evenement non trouve');
                    window.location.href = 'mes-soirees.html';
                    return;
                }

                const event = eventDoc.data();

                // Verify user is the creator
                if (event.createdBy !== userId) {
                    alert('Vous n\'etes pas autorise a voir ces statistiques');
                    window.location.href = 'mes-soirees.html';
                    return;
                }

                // Update header
                document.getElementById('eventName').textContent = event.name;
                const eventDate = new Date(event.date).toLocaleDateString('fr-BE', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                document.getElementById('eventDate').textContent = eventDate;

                // Get presales
                const getPresalesForEvent = httpsCallable(functions, 'getPresalesForEvent');
                const result = await getPresalesForEvent({ eventId });
                const presales = result.data.presales || [];

                loadingState.style.display = 'none';
                contentState.style.display = 'block';

                if (presales.length === 0) {
                    document.getElementById('noDataMessage').style.display = 'block';
                    return;
                }

                // Calculate stats
                const totalSold = presales.length;
                const totalUsed = presales.filter(p => p.status === 'used').length;
                const totalRevenue = presales
                    .filter(p => p.status !== 'refunded')
                    .reduce((sum, p) => sum + (p.amount * 0.88), 0);

                document.getElementById('totalSold').textContent = totalSold;
                document.getElementById('totalUsed').textContent = totalUsed;
                document.getElementById('totalRevenue').textContent = totalRevenue.toFixed(2) + ' EUR';

                // Populate table
                const tbody = document.getElementById('buyersTableBody');
                tbody.innerHTML = presales.map(p => {
                    let statusClass = 'status-valid';
                    let statusText = 'Valide';
                    if (p.status === 'used') {
                        statusClass = 'status-used';
                        statusText = 'Utilise';
                    } else if (p.status === 'refunded') {
                        statusClass = 'status-refunded';
                        statusText = 'Rembourse';
                    }

                    return `
                        <tr>
                            <td>${p.buyerNom || '-'}</td>
                            <td>${p.buyerPrenom || '-'}</td>
                            <td>${p.buyerAge || '-'}</td>
                            <td>${p.userEmail || '-'}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td style="font-size: 10px; font-family: monospace;">${p.id.substring(0, 8)}...</td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error('Erreur chargement stats:', error);
                loadingState.style.display = 'none';
                contentState.style.display = 'block';
                document.getElementById('noDataMessage').style.display = 'block';
                document.getElementById('noDataMessage').textContent = 'Erreur: ' + error.message;
            }
        }
    </script>
</body>
</html>
