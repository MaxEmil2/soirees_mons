<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Soirées Mons</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="/public/styles/design-system.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">🎉 Soirées Mons</a>
            <ul class="navbar-menu">
                <li><a href="dashboard.html" class="navbar-link">Mon Compte</a></li>
                <li><button id="logout-btn" class="btn btn-danger btn-sm">Déconnexion</button></li>
            </ul>
        </div>
    </nav>
    <div class="container" style="margin-top:40px;margin-bottom:80px">
        <h1 class="fade-in">👑 Panneau Admin</h1>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin:40px 0">
            <div class="card text-center">
                <div class="card-body"><h2 style="font-size:3rem;margin:0">-</h2><p>Utilisateurs</p></div>
            </div>
            <div class="card text-center">
                <div class="card-body"><h2 style="font-size:3rem;margin:0" id="events-count">0</h2><p>Événements</p></div>
            </div>
            <div class="card text-center">
                <div class="card-body"><h2 style="font-size:3rem;margin:0">-</h2><p>Tickets vendus</p></div>
            </div>
        </div>
        <h2>Événements en attente</h2>
        <div id="pending-events" class="grid grid-cols-2" style="gap:24px;margin-top:20px"></div>
    </div>
    <script type="module">
        import{authService}from'./src/services/auth.service.js';import{eventsService}from'./src/services/events.service.js';import{createEventCard}from'./src/components/EventCard.js';import{toast}from'./src/components/Toast.js';
        if(!authService.isAuthenticated()||!authService.isAdmin())window.location.href='/';
        async function load(){const r=await eventsService.getApprovedEvents({limitCount:100});if(r.success){document.getElementById('events-count').textContent=r.events.length}}
        load();
        document.getElementById('logout-btn').addEventListener('click',async()=>{await authService.signOut();window.location.href='/'});
    </script>
</body>
</html>
