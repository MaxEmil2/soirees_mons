<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner QR - Soirées Mons</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="/public/styles/design-system.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">🎉 Soirées Mons</a>
            <ul class="navbar-menu">
                <li><a href="dashboard.html" class="navbar-link">Mon Compte</a></li>
                <li><a href="mes-soirees.html" class="navbar-link">Mes Événements</a></li>
                <li><button id="logout-btn" class="btn btn-danger btn-sm">Déconnexion</button></li>
            </ul>
        </div>
    </nav>
    <div class="container" style="margin-top:40px;margin-bottom:80px">
        <h1 class="fade-in text-center">Scanner QR Code</h1>
        <p class="text-center" style="color:var(--text-secondary);margin-bottom:40px">Scannez les tickets des participants</p>
        <div id="scanner-container" style="max-width:600px;margin:0 auto"></div>
    </div>
    <script type="module">
        import{authService}from'./src/services/auth.service.js';import{QRScanner}from'./src/components/QRScanner.js';import{toast}from'./src/components/Toast.js';
        if(!authService.isAuthenticated()||!authService.isScanner())window.location.href='/';
        const scanner=new QRScanner('scanner-container',{onScanSuccess:(ticket)=>toast.success('Ticket validé !'),onScanError:(err)=>toast.error(err)});
        scanner.init();
        document.getElementById('logout-btn').addEventListener('click',async()=>{await scanner.cleanup();await authService.signOut();window.location.href='/'});
    </script>
</body>
</html>
