<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmation d'achat - Soirées Mons">
    <title>Achat Confirmé - Soirées Mons</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/assets/css/design-system.css">
    <link rel="stylesheet" href="/assets/css/components.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* Animated background */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--success) 0%, transparent 70%);
            top: -250px;
            left: -250px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-500) 0%, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation-delay: -10s;
            animation-direction: reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(100px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 100px) scale(0.9);
            }
        }

        .success-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            padding: 0 var(--space-4);
            text-align: center;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-card {
            background: var(--bg-secondary);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-2xl);
            padding: var(--space-12) var(--space-8);
            box-shadow: var(--shadow-2xl);
        }

        .success-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto var(--space-6);
            background: linear-gradient(135deg, var(--success), #73d13d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            animation: scaleIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .success-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-3);
            animation: fadeIn 0.6s ease 0.5s both;
        }

        .success-message {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-8);
            line-height: 1.6;
            animation: fadeIn 0.6s ease 0.7s both;
        }

        .event-info {
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            padding: var(--space-6);
            margin-bottom: var(--space-8);
            text-align: left;
            animation: fadeIn 0.6s ease 0.9s both;
        }

        .event-info-row {
            display: flex;
            justify-content: space-between;
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--border-primary);
        }

        .event-info-row:last-child {
            border-bottom: none;
        }

        .event-info-label {
            color: var(--text-tertiary);
            font-size: 0.875rem;
        }

        .event-info-value {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.9375rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            animation: fadeIn 0.6s ease 1.1s both;
        }

        .btn-full {
            width: 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Confetti animation */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--primary-500);
            position: absolute;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .success-card {
                padding: var(--space-8) var(--space-6);
            }

            .success-title {
                font-size: 2rem;
            }

            .success-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="success-container">
        <div class="success-card">

            <!-- Success Icon -->
            <div class="success-icon">
                ✓
            </div>

            <!-- Title -->
            <h1 class="success-title">Achat Confirmé !</h1>

            <!-- Message -->
            <p class="success-message">
                Votre prévente a été achetée avec succès. Vous recevrez un email de confirmation avec votre QR code.
            </p>

            <!-- Event Info -->
            <div class="event-info" id="event-info">
                <div class="event-info-row">
                    <span class="event-info-label">Événement</span>
                    <span class="event-info-value" id="event-name">Chargement...</span>
                </div>
                <div class="event-info-row">
                    <span class="event-info-label">Date</span>
                    <span class="event-info-value" id="event-date">-</span>
                </div>
                <div class="event-info-row">
                    <span class="event-info-label">Prix</span>
                    <span class="event-info-value" id="event-price">-</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <a href="/mes-preventes.html" class="btn btn-primary btn-full">
                    Voir mes préventes
                </a>
                <a href="/index.html" class="btn btn-secondary btn-full">
                    Retour à l'accueil
                </a>
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script type="module">
        import { db } from '/assets/js/core/firebase-config.js';
        import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Get presale ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const presaleId = urlParams.get('presaleId');

        if (presaleId) {
            // Load presale and event info
            loadPresaleInfo(presaleId);
        }

        async function loadPresaleInfo(presaleId) {
            try {
                // Get presale
                const presaleDoc = await getDoc(doc(db, 'presales', presaleId));

                if (!presaleDoc.exists()) {
                    console.error('Presale not found');
                    return;
                }

                const presale = presaleDoc.data();

                // Get event
                const eventDoc = await getDoc(doc(db, 'events', presale.eventId));

                if (!eventDoc.exists()) {
                    console.error('Event not found');
                    return;
                }

                const event = eventDoc.data();

                // Update UI
                document.getElementById('event-name').textContent = event.name;
                document.getElementById('event-date').textContent = formatDate(event.date);
                document.getElementById('event-price').textContent = `${(presale.price / 100).toFixed(2)}€`;

            } catch (error) {
                console.error('Error loading presale info:', error);
            }
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';

            let date;
            if (timestamp.toDate) {
                date = timestamp.toDate();
            } else if (timestamp instanceof Date) {
                date = timestamp;
            } else {
                date = new Date(timestamp);
            }

            return date.toLocaleDateString('fr-FR', {
                day: '2-digit',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Create confetti effect
        function createConfetti() {
            const colors = ['#6c63ff', '#00d4ff', '#52c41a', '#faad14', '#ff4d4f'];

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
            }

            // Remove confetti after animation
            setTimeout(() => {
                document.querySelectorAll('.confetti').forEach(el => el.remove());
            }, 5000);
        }

        // Trigger confetti on load
        window.addEventListener('load', () => {
            setTimeout(createConfetti, 500);
        });
    </script>

</body>
</html>
